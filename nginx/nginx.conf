# Do not advertise the nginx version in the Server header or on error pages — it
# hands a scanner a version to match known CVEs against, for free.
server_tokens off;

upstream web_app {
    server web:8000;
}

server {
    listen 80;
    server_name ezlain.app www.ezlain.app;
    client_max_body_size 250M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name ezlain.app www.ezlain.app;
    
    ssl_certificate /etc/letsencrypt/live/ezlain.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ezlain.app/privkey.pem;
    
    client_max_body_size 250M;

    # X-Frame-Options, X-Content-Type-Options and Referrer-Policy are set by
    # Django (see config/settings/production.py) so they hold however the app is
    # deployed. Setting them here as well produced the duplicate headers the
    # audit flagged — when two layers disagree, browsers pick unpredictably.
    #
    # CSP has no Django equivalent without an extra package, so it lives here.
    # The dashboard still uses inline <script> blocks, hence 'unsafe-inline';
    # removing those and dropping it is worth doing separately.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://web_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
    }
}
