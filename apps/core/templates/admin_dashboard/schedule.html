{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EZLain Reading Schedule</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <link rel="stylesheet" href="{% static 'css/admin_dashboard.css' %}">
  <style>
      .grid-header {
          display: grid;
          grid-template-columns: 120px 1fr 1.5fr 1fr 80px;
          gap: 16px;
      }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="side-logo"><div class="logo-mark">EZ</div><div class="side-copy"><div class="side-brand">EZLain</div><div class="side-sub">Admin</div></div></div>
      {% include 'admin_dashboard/sidebar.html' with active_page='schedule' %}
      <div class="side-footer"><div class="avatar" id="footerAvatar"></div><div><strong id="footerName"></strong><br><span id="footerRole" style="color:rgba(255,255,255,.45)"></span></div></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <button class="menu-btn" id="toggleSidebar" aria-label="Toggle sidebar">☰</button>
        <div class="page-title">Reading Schedule</div>
        <button class="btn primary" id="openAddModal">Add Schedule</button>
      </header>
      <section class="content">
        <div class="single-column">
          <div class="toolbar">
            <input class="toolbar-search" type="month" id="monthFilter" style="flex:1" placeholder="Filter by Month...">
          </div>

          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
            <h1 style="font-size:18px;margin:0">Calendar Schedule <span id="countText" style="color:var(--text3);font-weight:400"></span></h1>
          </div>
          
          <div class="table">
            <div class="table-head grid-header">
                <div>Date</div>
                <div>Hebrew Date</div>
                <div>Parsha</div>
                <div>Sefer</div>
                <div>Actions</div>
            </div>
            <div id="scheduleRows"></div>
            <div class="footer"><span id="rangeText"></span></div>
          </div>
        </div>
      </section>
    </main>
  </div>
  
  <div class="modal-overlay" id="editModal">
    <form class="modal" id="editForm">
      <div class="modal-head">
          <span id="modalTitle">Add Schedule</span>
          <button class="small-btn" type="button" id="closeModal">×</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="editScheduleId">
        <div class="form-grid">
          <label class="field full"><span class="label">Date (Gregorian)</span><input type="date" class="input" id="dateInput" required></label>
          <label class="field full"><span class="label">Hebrew Date String</span><input type="text" class="input" id="hebrewDateInput" placeholder="e.g. 14 Iyar 5786" required></label>
          <label class="field full"><span class="label">Parsha</span>
            <select class="select" id="parshaInput" required>
                <option value="">Select Parsha</option>
            </select>
          </label>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn" type="button" id="cancelEdit">Cancel</button>
        <button class="btn primary" type="submit">Save</button>
      </div>
    </form>
  </div>
  
  <div class="toast" id="toast"></div>

  <script src="{% static 'js/admin_dashboard.js' %}?v=1.1"></script>
  <script src="{% static 'js/admin_core.js' %}"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
        const rowsEl = document.getElementById("scheduleRows");
        const monthFilter = document.getElementById("monthFilter");
        const parshaInput = document.getElementById("parshaInput");
        const editForm = document.getElementById("editForm");
        const editModal = document.getElementById("editModal");
        
        let allParshas = [];
        
        // Initialize profile
        try {
            const res = await apiFetch('/core/admin/settings/');
            if (res.ok) {
                const resJson = await res.json();
                const settings = Array.isArray(resJson.data || resJson) ? (resJson.data || resJson)[0] : (resJson.data || resJson);
                if (settings && settings.admin_profile) {
                    document.getElementById("footerName").textContent = settings.admin_profile.name;
                    document.getElementById("footerRole").textContent = settings.admin_profile.role;
                    document.getElementById("footerAvatar").textContent = settings.admin_profile.name.substring(0,2).toUpperCase();
                }
            }
        } catch(e) {}
        
        // Load Parshas for dropdown
        async function loadParshas() {
            try {
                const res = await apiFetch('/parshas/list/');
                if (res.ok) {
                    const resJson = await res.json();
                    const data = resJson.data || resJson;
                    allParshas = data.results || data;
                    parshaInput.innerHTML = '<option value="">Select Parsha</option>' + 
                        allParshas.map(p => `<option value="${p.id}">${p.name} (${p.sefer})</option>`).join("");
                }
            } catch (e) {
                console.error("Failed to load parshas:", e);
            }
        }
        
        // Load Schedules
        async function loadSchedules() {
            rowsEl.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text3)">Loading schedule...</div>';
            
            let url = '/parshas/calendar/';
            const [y, m] = (monthFilter.value || "").split("-");
            if (y && m) {
                url += `?year=${y}&month=${parseInt(m, 10)}`;
            }
            
            try {
                const res = await apiFetch(url);
                if (res.ok) {
                    const resJson = await res.json();
                    const data = (resJson.data || resJson).results || (resJson.data || resJson);
                    document.getElementById("countText").textContent = `(${data.length})`;
                    
                    if (data.length === 0) {
                        rowsEl.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text3)">No schedules found.</div>';
                        return;
                    }
                    
                    rowsEl.innerHTML = data.map(r => `
                    <div class="row grid-header" style="padding:12px 16px;border-bottom:1px solid var(--border)">
                        <div style="font-family:monospace;color:var(--text2)">${r.date}</div>
                        <div>${r.hebrew_date}</div>
                        <div style="font-weight:600">${r.parsha ? r.parsha.name : 'Unknown'}</div>
                        <div style="color:var(--text3)">${r.parsha ? r.parsha.sefer : ''}</div>
                        <div>
                            <button class="small-btn edit-btn" data-id="${r.id}" aria-label="Edit">✏️</button>
                            <button class="small-btn del-btn" data-id="${r.id}" style="color:red;margin-left:8px" aria-label="Delete">🗑️</button>
                        </div>
                    </div>
                    `).join('');
                }
            } catch (e) {
                rowsEl.innerHTML = '<div style="padding:40px;text-align:center;color:red">Failed to load schedule</div>';
            }
        }
        
        // Filters
        monthFilter.addEventListener("change", loadSchedules);
        
        // Modals
        function openModal(id=null) {
            editForm.reset();
            document.getElementById("editScheduleId").value = id || "";
            document.getElementById("modalTitle").textContent = id ? "Edit Schedule" : "Add Schedule";
            editModal.classList.add("open");
        }
        
        function closeM() {
            editModal.classList.remove("open");
        }
        
        document.getElementById("openAddModal").addEventListener("click", () => openModal());
        document.getElementById("closeModal").addEventListener("click", closeM);
        document.getElementById("cancelEdit").addEventListener("click", closeM);
        
        // Edit and Delete
        rowsEl.addEventListener("click", async (e) => {
            const editBtn = e.target.closest('.edit-btn');
            if (editBtn) {
                const id = editBtn.dataset.id;
                try {
                    const res = await apiFetch(`/parshas/calendar/${id}/`);
                    if (res.ok) {
                        const resJson = await res.json();
                        const r = resJson.data || resJson;
                        document.getElementById("dateInput").value = r.date;
                        document.getElementById("hebrewDateInput").value = r.hebrew_date;
                        if (r.parsha) {
                            parshaInput.value = r.parsha.id;
                        }
                        openModal(id);
                    }
                } catch(err) {
                    if (typeof toast === 'function') toast("Failed to load details.");
                }
            }
            
            const delBtn = e.target.closest('.del-btn');
            if (delBtn) {
                if(confirm("Are you sure you want to delete this schedule entry?")) {
                    const id = delBtn.dataset.id;
                    try {
                        const res = await apiFetch(`/parshas/calendar/${id}/`, { method: "DELETE" });
                        if (res.ok) {
                            if (typeof toast === 'function') toast("Schedule deleted successfully.");
                            loadSchedules();
                        } else {
                            if (typeof toast === 'function') toast("Failed to delete.");
                        }
                    } catch(err) {
                        if (typeof toast === 'function') toast("Error deleting schedule.");
                    }
                }
            }
        });
        
        // Save
        editForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const id = document.getElementById("editScheduleId").value;
            const payload = {
                date: document.getElementById("dateInput").value,
                hebrew_date: document.getElementById("hebrewDateInput").value,
                parsha_id: parshaInput.value
            };
            
            const method = id ? "PATCH" : "POST";
            const url = id ? `/parshas/calendar/${id}/` : `/parshas/calendar/`;
            
            try {
                const res = await apiFetch(url, { method, body: JSON.stringify(payload) });
                if (res.ok) {
                    if (typeof toast === 'function') toast(id ? "Schedule updated." : "Schedule added.");
                    closeM();
                    loadSchedules();
                } else {
                    if (typeof toast === 'function') toast("Error saving schedule.");
                }
            } catch(err) {
                if (typeof toast === 'function') toast("Error saving schedule.");
            }
        });
        
        await loadParshas();
        loadSchedules();
    });
  </script>
</body>
</html>
