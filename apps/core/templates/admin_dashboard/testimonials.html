{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EZLain – Testimonials</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/admin_dashboard.css' %}">
  <script src="{% static 'js/admin_core.js' %}"></script>
  <style>
    .feedback-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
    .fb-card {
      background: var(--a-bg);
      border: 1px solid var(--a-border);
      border-radius: 12px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: box-shadow .2s, border-color .2s;
    }
    .fb-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,.12); border-color: var(--a-primary); }
    .fb-head { display: flex; align-items: center; gap: 10px; }
    .fb-avatar {
      width: 38px; height: 38px; border-radius: 50%;
      background: linear-gradient(135deg, var(--a-primary), #1a7a5e);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 14px; color: #fff; flex-shrink: 0;
    }
    .fb-meta { flex: 1; min-width: 0; }
    .fb-name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fb-email { font-size: 11px; color: var(--a-text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fb-time { font-size: 11px; color: var(--a-text3); white-space: nowrap; }
    .fb-message {
      font-size: 13.5px;
      color: var(--a-text2);
      line-height: 1.55;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .fb-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; border-top: 1px solid var(--a-border); padding-top: 12px; }
    
    .status-badge {
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
      padding: 4px 10px; border-radius: 12px;
    }
    .status-pending { background: #fff3cd; color: #856404; }
    .status-approved { background: #d4edda; color: #155724; }
    .status-rejected { background: #f8d7da; color: #721c24; }

    .action-btns { display: flex; gap: 8px; }
    .action-btn { 
      font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 6px; 
      border: 1px solid transparent; cursor: pointer; transition: all 0.15s;
    }
    .btn-approve { background: #e8f5e9; color: #2e7d32; border-color: #c8e6c9; }
    .btn-approve:hover { background: #c8e6c9; }
    .btn-reject { background: #ffebee; color: #c62828; border-color: #ffcdd2; }
    .btn-reject:hover { background: #ffcdd2; }

    .empty-state { text-align: center; padding: 60px 20px; color: var(--a-text3); }
    .empty-state svg { margin-bottom: 14px; opacity: .35; }
    .empty-state p { font-size: 15px; }

    .stat-row { display: flex; gap: 14px; margin-bottom: 20px; flex-wrap: wrap; }
    .stat-pill {
      background: var(--a-bg); border: 1px solid var(--a-border); border-radius: 30px;
      padding: 8px 18px; font-size: 13px; font-weight: 600;
      display: flex; align-items: center; gap: 8px;
    }
    .stat-pill span { color: var(--a-text3); font-weight: 400; }
    
    .stars { color: #f5b041; font-size: 14px; }
  </style>
</head>
<body>
  <div class="toast" id="toast"></div>
  <div class="shell">
    <aside class="sidebar">
      <div class="side-logo"><div class="logo-mark">EZ</div><div class="side-copy"><div class="side-brand">EZLain</div><div class="side-sub">Admin</div></div></div>
      {% include 'admin_dashboard/sidebar.html' with active_page='testimonials' %}
      <div class="side-footer"><div class="avatar">RA</div><div><strong>Rabbi Admin</strong><br><span style="color:rgba(255,255,255,.45)">Super Admin</span></div></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <button class="menu-btn" id="toggleSidebar" aria-label="Toggle sidebar">☰</button>
        <div class="page-title">Testimonials</div>
      </header>
      <section class="content">
        <div class="toolbar stacked" style="margin-bottom:20px; display:flex; gap:16px;">
          <input class="toolbar-search" id="searchInput" placeholder="Search by name or text…" style="max-width:400px;">
          <select class="toolbar-search" id="statusFilter" style="max-width:180px; border-radius:30px;">
            <option value="">All Statuses</option>
            <option value="pending">Pending</option>
            <option value="approved">Approved</option>
            <option value="rejected">Rejected</option>
          </select>
        </div>

        <div class="stat-row">
          <div class="stat-pill">💬 Total: <span id="totalCount">…</span></div>
          <div class="stat-pill">✅ Approved: <span id="approvedCount">…</span></div>
          <div class="stat-pill">⏳ Pending: <span id="pendingCount">…</span></div>
        </div>

        <div class="feedback-grid" id="feedbackGrid"></div>
        <div class="empty-state" id="emptyState" style="display:none;">
          <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
          <p>No testimonials found.</p>
        </div>
      </section>
    </main>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      let allItems = [];

      function initials(name) {
        return (name || '').split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2) || 'T';
      }

      function timeAgo(iso) {
        const diff = (Date.now() - new Date(iso)) / 1000;
        if (diff < 60) return 'Just now';
        if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
        if (diff < 86400) return `${Math.floor(diff/3600)}h ago`;
        if (diff < 604800) return `${Math.floor(diff/86400)}d ago`;
        return new Date(iso).toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'});
      }

      function renderStars(rating) {
        return '★'.repeat(rating) + '☆'.repeat(5 - rating);
      }

      function renderCard(item) {
        const card = document.createElement('div');
        card.className = 'fb-card';
        card.innerHTML = `
          <div class="fb-head">
            <div class="fb-avatar">${initials(item.name)}</div>
            <div class="fb-meta">
              <div class="fb-name">${item.name}</div>
              <div class="fb-email">${item.designation || 'User'} <span class="stars" style="margin-left:6px;">${renderStars(item.rating)}</span></div>
            </div>
            <div class="fb-time">${timeAgo(item.created_at)}</div>
          </div>
          <div class="fb-message" title="${item.text.replace(/"/g, '&quot;')}">${item.text}</div>
          <div class="fb-footer">
            <span class="status-badge status-${item.status}">${item.status}</span>
            <div class="action-btns">
              ${item.status !== 'approved' ? `<button class="action-btn btn-approve" data-id="${item.id}" data-action="approved">Approve</button>` : ''}
              ${item.status !== 'rejected' ? `<button class="action-btn btn-reject" data-id="${item.id}" data-action="rejected">Reject</button>` : ''}
            </div>
          </div>
        `;
        
        card.querySelectorAll('.action-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            updateStatus(btn.dataset.id, btn.dataset.action);
          });
        });
        
        return card;
      }

      function render(items) {
        const grid = document.getElementById('feedbackGrid');
        const empty = document.getElementById('emptyState');
        grid.innerHTML = '';
        if (!items.length) { empty.style.display = 'block'; return; }
        empty.style.display = 'none';
        items.forEach(item => grid.appendChild(renderCard(item)));
      }

      async function updateStatus(id, newStatus) {
        try {
          const res = await apiFetch(`/core/admin/settings/testimonials/${id}/`, {
            method: 'PATCH',
            body: JSON.stringify({ status: newStatus })
          });
          if (res.ok) {
            toast(`Testimonial marked as ${newStatus}`);
            // Update local state
            const item = allItems.find(i => i.id == id);
            if (item) item.status = newStatus;
            filterData();
            updateStats();
          } else {
            toast('Failed to update status');
          }
        } catch (e) {
          toast('Network error');
        }
      }

      function filterData() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        const s = document.getElementById('statusFilter').value;
        render(allItems.filter(i => {
          const matchQ = (i.name||'').toLowerCase().includes(q) || (i.text||'').toLowerCase().includes(q);
          const matchS = s ? i.status === s : true;
          return matchQ && matchS;
        }));
      }

      function updateStats() {
        document.getElementById('totalCount').textContent = allItems.length;
        document.getElementById('approvedCount').textContent = allItems.filter(i => i.status === 'approved').length;
        document.getElementById('pendingCount').textContent = allItems.filter(i => i.status === 'pending').length;
      }

      document.getElementById('searchInput').addEventListener('input', filterData);
      document.getElementById('statusFilter').addEventListener('change', filterData);

      // Load data
      async function loadData() {
        try {
          const res = await apiFetch('/core/admin/settings/testimonials_list/');
          if (res.ok) {
            const json = await res.json();
            const data = json.data || {};
            allItems = data.results || [];
            updateStats();
            filterData();
          }
        } catch (e) {
          document.getElementById('emptyState').style.display = 'block';
          document.getElementById('emptyState').querySelector('p').textContent = 'Failed to load testimonials.';
        }
      }
      
      loadData();

      // Sidebar toggle
      const toggle = document.getElementById('toggleSidebar');
      if (toggle) toggle.addEventListener('click', () => document.querySelector('.shell').classList.toggle('sidebar-open'));
    });
  </script>
</body>
</html>
