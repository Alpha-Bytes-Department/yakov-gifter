{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EZLain Admin Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/admin_dashboard.css' %}">
</head>
<body>
  <main class="login-page">
    <form class="login-card" id="loginForm">
      <div class="login-logo-row">
        <div class="logo-mark">EZ</div>
        <div>
          <div class="brand-name">EZLain</div>
          <div class="brand-sub">Admin Portal</div>
        </div>
      </div>
      <div class="login-badge">Restricted Access</div>
      <hr class="divider">
      <label class="field">
        <span class="label">Email Address</span>
        <input class="input" type="email" id="email" required>
      </label>
      <label class="field">
        <span class="label">Password</span>
        <input class="input focused" type="password" id="password" required>
      </label>
      <label class="field" id="otpField" style="display:none">
        <span class="label">Two-Factor Code</span>
        <input class="input" type="text" id="otp" inputmode="numeric"
               autocomplete="one-time-code" maxlength="14"
               placeholder="6-digit code or recovery code">
      </label>
      <button class="login-submit" type="submit">Sign In to Dashboard</button>
      <div class="security"><span>Protected · TLS 1.3</span></div>
    </form>
  </main>
  <div class="toast" id="toast"></div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById("loginForm");
        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const otp = document.getElementById('otp').value;
            
            try {
                // Establishes a Django session. The cookie is HttpOnly, so
                // unlike the tokens this used to stash in localStorage, page
                // script cannot read it.
                const res = await fetch('/dashboard/session-login/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken') || '',
                    },
                    credentials: 'same-origin',
                    body: JSON.stringify({ email, password, otp })
                });

                const responseData = await res.json().catch(() => ({}));

                if (res.ok) {
                    toast("Login successful");
                    const next = new URLSearchParams(window.location.search).get('next');
                    setTimeout(() => { window.location.href = next || "/dashboard/"; }, 450);
                } else if (responseData.otp_required) {
                    // Password accepted; the account has 2FA enabled, so reveal
                    // the code field and let them finish.
                    document.getElementById('otpField').style.display = '';
                    document.getElementById('otp').focus();
                    toast(responseData.detail || 'Enter your two-factor code');
                } else {
                    toast(responseData.detail || 'Invalid credentials');
                }
            } catch (err) {
                toast('Network error');
            }
        });
    });
</script>

  <script src="{% static 'js/admin_core.js' %}"></script>
</body>
</html>
