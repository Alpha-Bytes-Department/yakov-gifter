{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EZLain Admin Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/admin_dashboard.css' %}">
</head>
<body>
  <main class="login-page">
    <form class="login-card" id="loginForm">
      <div class="login-logo-row">
        <div class="logo-mark">EZ</div>
        <div>
          <div class="brand-name">EZLain</div>
          <div class="brand-sub">Admin Portal</div>
        </div>
      </div>
      <div class="login-badge">Restricted Access</div>
      <hr class="divider">
      <label class="field">
        <span class="label">Email Address</span>
        <input class="input" type="email" id="email" required>
      </label>
      <label class="field">
        <span class="label">Password</span>
        <input class="input focused" type="password" id="password" required>
      </label>
      <button class="login-submit" type="submit">Sign In to Dashboard</button>
      <div class="security"><span>Protected · TLS 1.3 · 2FA Enabled</span></div>
    </form>
  </main>
  <div class="toast" id="toast"></div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById("loginForm");
        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const res = await fetch('/api/v1/accounts/login/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const responseData = await res.json();
                
                if (res.ok && responseData.success !== false) {
                    const payload = responseData.data || responseData;
                    if(payload.tokens) {
                        localStorage.setItem('access_token', payload.tokens.access);
                        localStorage.setItem('refresh_token', payload.tokens.refresh);
                        toast("Login successful");
                        setTimeout(() => { window.location.href = "/dashboard/"; }, 450);
                    }
                } else {
                    const errPayload = responseData.errors || responseData;
                    toast(errPayload.detail || errPayload.non_field_errors?.[0] || responseData.message || 'Invalid credentials');
                }
            } catch (err) {
                toast('Network error');
            }
        });
    });
</script>

  <script src="{% static 'js/admin_core.js' %}"></script>
</body>
</html>
