{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EZLain Notifications</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <link rel="stylesheet" href="{% static 'css/admin_dashboard.css' %}">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="side-logo"><div class="logo-mark">EZ</div><div class="side-copy"><div class="side-brand">EZLain</div><div class="side-sub">Admin</div></div></div>
      {% include 'admin_dashboard/sidebar.html' with active_page='notifications' %}
      <div class="side-footer"><div class="avatar">RA</div><div><strong>Rabbi Admin</strong><br><span style="color:rgba(255,255,255,.45)">Super Admin</span></div></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <button class="menu-btn" id="toggleSidebar" aria-label="Toggle sidebar">☰</button>
        <div class="page-title">Notifications</div>
      </header>
      <section class="content">
        <div class="single-column">
          <div class="panel">
            <div class="panel-head">Compose Notification</div>
            <form class="modal-body" id="notifyForm">
              <label class="field"><span class="label">Audience</span><select class="select" id="audience"><option>All users</option><option>Pro subscribers</option><option>Free users</option><option>Trial users</option></select></label>
              <label class="field"><span class="label">Title</span><input class="input" id="title" value="New Chumash audio available" required></label>
              <label class="field"><span class="label">Message</span><textarea class="textarea" id="message" required>Bereishit Aliya 1 is ready for practice.</textarea></label>
              <div style="display:flex;justify-content:center"><button class="btn primary" style="height:34px" type="submit">Send Notification</button></div>
            </form>
          </div>

          <div class="toolbar">
            <input class="toolbar-search" id="search" style="flex:1" placeholder="Search notifications...">
            <select class="chip" id="audienceFilter"><option value="All">All audiences</option><option>All users</option><option>Pro subscribers</option><option>Free users</option><option>Trial users</option></select>
          </div>

          <div class="panel">
            <div class="panel-head">Recent Sends <span id="countText" class="row-meta"></span></div>
            <div id="sendRows"></div>
            <div class="footer"><span id="rangeText"></span><div class="pages" id="pages"></div></div>
          </div>
        </div>
      </section>
    </main>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
        const rowsEl = document.getElementById("sendRows");
        const pagesEl = document.getElementById("pages");
        const notifyForm = document.getElementById("notifyForm");
        
        let notifications = [];
        const state = { page: 1, perPage: 5, query: "", audience: "All" };

        const audienceMap = {
            'all': 'All users',
            'pro': 'Pro subscribers',
            'free': 'Free users',
            'trial': 'Trial users'
        };

        const audienceReverseMap = {
            'All users': 'all',
            'Pro subscribers': 'pro',
            'Free users': 'free',
            'Trial users': 'free' // backend defaults non-pro to free
        };

        async function loadNotifications() {
            try {
                const res = await apiFetch('/core/admin/notifications/');
                if (res.ok) {
                    const responseData = await res.json();
                    const data = responseData.data || responseData;
                    notifications = data.results || data;
                    render();
                }
            } catch (e) {
                console.error(e);
            }
        }

        function filteredNotifications() {
            const q = state.query.toLowerCase();
            return notifications.filter(item => {
                const audienceLabel = audienceMap[item.audience] || item.audience;
                const matchQuery = [item.title, item.message, audienceLabel].join(" ").toLowerCase().includes(q);
                const matchAudience = state.audience === "All" || audienceLabel === state.audience;
                return matchQuery && matchAudience;
            });
        }

        function render() {
            const rows = filteredNotifications();
            const totalPages = Math.max(1, Math.ceil(rows.length / state.perPage));
            if (state.page > totalPages) state.page = totalPages;
            
            const start = (state.page - 1) * state.perPage;
            const pageRows = rows.slice(start, start + state.perPage);
            
            if (rowsEl) {
                rowsEl.innerHTML = pageRows.length ? pageRows.map(item => {
                    const audienceLabel = audienceMap[item.audience] || item.audience;
                    const date = new Date(item.created_at).toLocaleString();
                    return `
                        <div class="row">
                            <div class="thumb">!</div>
                            <div class="row-main">
                                <div class="row-title">${item.title}</div>
                                <div>${item.message}</div>
                                <div class="row-meta">${audienceLabel} · ${(item.recipients_count || 0).toLocaleString()} recipients · ${date}</div>
                            </div>
                            <button class="small-btn" data-delete="${item.id}" aria-label="Delete notification">x</button>
                        </div>
                    `;
                }).join("") : `<div class="empty">No notifications found.</div>`;
            }

            document.getElementById("countText").textContent = `${rows.length} sends`;
            document.getElementById("rangeText").textContent = rows.length ? `Showing ${start + 1}-${Math.min(start + state.perPage, rows.length)} of ${rows.length}` : "Showing 0";
            
            if (pagesEl) {
                pagesEl.innerHTML = totalPages > 1 ? Array.from({ length: totalPages }, (_, i) => 
                    `<button class="page ${state.page === i + 1 ? "active" : ""}" data-page="${i + 1}">${i + 1}</button>`
                ).join("") : "";

                document.querySelectorAll("[data-page]").forEach(b => b.onclick = () => {
                    state.page = Number(b.dataset.page);
                    render();
                });
            }

            document.querySelectorAll("[data-delete]").forEach(b => b.onclick = () => deleteNotification(b.dataset.delete));
        }

        async function deleteNotification(id) {
            if (confirm("Are you sure you want to delete this notification history?")) {
                try {
                    const res = await apiFetch(`/core/admin/notifications/${id}/`, { method: 'DELETE' });
                    if (res.status === 204 || res.ok) {
                        toast("Notification deleted");
                        loadNotifications();
                    }
                } catch (e) {
                    console.error(e);
                    toast("Delete failed");
                }
            }
        }

        if (notifyForm) {
            notifyForm.addEventListener("submit", async (e) => {
                e.preventDefault();
                const audienceVal = document.getElementById("audience").value;
                const title = document.getElementById("title").value.trim();
                const message = document.getElementById("message").value.trim();
                const audience = audienceReverseMap[audienceVal] || 'all';

                try {
                    const res = await apiFetch('/core/admin/notifications/', {
                        method: 'POST',
                        body: JSON.stringify({ title, message, audience })
                    });
                    if (res.ok) {
                        toast("Notification Sent");
                        notifyForm.reset();
                        loadNotifications();
                    } else {
                        toast("Failed to send notification");
                    }
                } catch (e) {
                    console.error(e);
                    toast("Network Error");
                }
            });
        }

        document.getElementById("search").oninput = () => {
            state.query = document.getElementById("search").value;
            state.page = 1;
            render();
        };

        document.getElementById("audienceFilter").onchange = () => {
            state.audience = document.getElementById("audienceFilter").value;
            state.page = 1;
            render();
        };

        loadNotifications();
    });
  </script>

  <script src="{% static 'js/admin_core.js' %}"></script>
</body>
</html>
