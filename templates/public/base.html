<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Ezlain{% endblock %}</title>
  <meta name="description" content="{% block description %}Ezlain — learn your parsha.{% endblock %}">
  <style>
    :root {
      --ink: #0d1b24;
      --muted: #5b6b76;
      --line: #dde5ea;
      --accent: #0f4c5c;
      --bg: #fbfcfd;
      --warn-bg: #fff8e6;
      --warn-line: #e8d49a;
      --warn-ink: #6b5310;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    .wrap { max-width: 680px; margin: 0 auto; padding: 0 24px; }
    header { padding: 56px 0 32px; }
    .mark {
      font-size: 13px; letter-spacing: .14em; text-transform: uppercase;
      color: var(--accent); font-weight: 700; margin-bottom: 18px;
      text-decoration: none; display: inline-block;
    }
    h1 { font-size: 32px; line-height: 1.2; margin: 0 0 8px; letter-spacing: -.02em; }
    h2 { font-size: 17px; margin: 32px 0 6px; }
    .updated { color: var(--muted); font-size: 14px; margin: 0; }
    .notice {
      background: var(--warn-bg); border: 1px solid var(--warn-line);
      color: var(--warn-ink); border-radius: 8px; padding: 14px 16px;
      font-size: 14px; margin: 28px 0;
    }
    main { padding-bottom: 16px; }
    p { margin: 0 0 14px; }
    footer {
      border-top: 1px solid var(--line); margin-top: 40px;
      padding: 24px 0 64px; color: var(--muted); font-size: 14px;
    }
    footer a { color: var(--accent); margin-right: 14px; }
    @media (max-width: 520px) { h1 { font-size: 26px; } header { padding-top: 36px; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="mark" href="/">Ezlain</a>
      <h1>{% block heading %}{% endblock %}</h1>
      {% block subhead %}{% endblock %}
    </header>
    <main>{% block content %}{% endblock %}</main>
    <footer>
      <a href="/">Home</a>
      <a href="/privacy/">Privacy</a>
      <a href="/terms/">Terms</a>
      <a href="/support/">Support</a>
    </footer>
  </div>
</body>
</html>
