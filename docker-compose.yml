version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-ezlain_db}
      POSTGRES_USER: ${DB_USER:-ezlain_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ezlain_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ezlain_user"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ezlain-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ezlain-network

  web:
    build: .
    command: ./entrypoint.sh gunicorn config.wsgi:application -c gunicorn.conf.py
    volumes:
      - .:/app
      - static_files:/app/staticfiles
      - media_files:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ezlain-network

  celery_worker:
    build: .
    command: ./celery_entrypoint.sh celery -A config worker -l info
    volumes:
      - .:/app
      - media_files:/app/media
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ezlain-network

  celery_beat:
    build: .
    command: ./celery_entrypoint.sh celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ezlain-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_files:/app/staticfiles
      - media_files:/app/media
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - web
    networks:
      - ezlain-network

volumes:
  postgres_data:
  redis_data:
  static_files:
  media_files:

networks:
  ezlain-network:
    driver: bridge
