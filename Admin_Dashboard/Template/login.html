<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EZLain Admin Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="login-page">
    <form class="login-card" id="loginForm">
      <div class="login-logo-row">
        <div class="logo-mark">EZ</div>
        <div>
          <div class="brand-name">EZLain</div>
          <div class="brand-sub">Admin Portal</div>
        </div>
      </div>
      <div class="login-badge">Restricted Access</div>
      <hr class="divider">
      <label class="field">
        <span class="label">Email Address</span>
        <input class="input" type="email" id="email" value="admin@ezlain.app" required>
      </label>
      <label class="field">
        <span class="label">Password</span>
        <input class="input focused" type="password" id="password" value="admin12345" required>
      </label>
      <button class="login-submit" type="submit">Sign In to Dashboard</button>
      <div class="security"><span>Protected · TLS 1.3 · 2FA Enabled</span></div>
    </form>
  </main>
  <div class="toast" id="toast"></div>

  <script>
    function toast(message) {
      const el = document.getElementById("toast");
      el.textContent = message;
      el.classList.add("show");
      setTimeout(() => el.classList.remove("show"), 1000);
    }

    document.getElementById("loginForm").addEventListener("submit", (event) => {
      event.preventDefault();
      toast("Login successful");
      setTimeout(() => { window.location.href = "./dashboard.html"; }, 450);
    });
  </script>
</body>
</html>
